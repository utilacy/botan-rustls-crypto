[package]
name = "botan-crypto-provider"
version = "1.1.0"
edition = "2024"
authors = ["Amin Faez"]
license = "MIT OR Apache-2.0"
description = "A rustls CryptoProvider backed entirely by the Botan cryptography library"
repository = "https://github.com/utilacy/botan-rustls-crypto"
readme = "README.md"
categories = ["crypto"]


[features]
# Compile Botan 3 from source and link it statically
vendored = ["botan/vendored"]

[dependencies]
botan = "0.14.1"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "logging"] }
zeroize = "1.9.1"
subtle = "2.6"

[dev-dependencies]
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
